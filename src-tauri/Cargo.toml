[package]
name = "quack-api"
version = "0.1.0"
description = "API testing tool"
authors = ["you"]
edition = "2021"
default-run = "quack-api"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quack"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-stronghold = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2.6.0"
uuid = { version = "1.21.0", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "charset", "gzip", "brotli", "deflate", "cookies", "stream", "socks", "multipart"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
url = "2"
base64 = "0.22.1"
regex = "1"
tokio = { version = "1.49.0", features = ["sync", "rt-multi-thread", "macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
dirs = "5"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Deny all warnings - treat them as errors
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Unimplemented items can be left as warnings
todo = "warn"
unimplemented = "warn"

# Correctness (deny)
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"

# Performance (warn/deny)
inefficient_to_string = "deny"
large_enum_variant = "warn"
large_stack_arrays = "warn"
needless_pass_by_value = "warn"

# Style (warn)
missing_errors_doc = "warn"
missing_panics_doc = "warn"
